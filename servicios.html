<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios · Nails Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#e8a4b8', 'primary-light': '#f4c2c2', accent: '#d4a574', 'background-dark': '#0f0a0c', 'background-card': '#1a1418' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="servicios" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main>
    <section class="py-20 border-b border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-medium">Catálogo completo</p>
        <h1 class="text-5xl md:text-6xl font-bold text-white mb-6" style="font-family: 'Playfair Display', serif;">Nuestros servicios</h1>
        <p class="text-gray-300 text-lg max-w-2xl mx-auto">Técnicas profesionales, productos premium y resultados impecables para tus manos y pies.</p>
      </div>
    </section>

    <section class="py-12">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap justify-center gap-2 mb-10" id="filterCategoria"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="serviciosGrid"></div>
      </div>
    </section>

    <section class="py-16 bg-background-card/40 border-y border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
          <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-medium">Nuestro equipo</p>
          <h2 class="text-3xl md:text-4xl font-bold text-white" style="font-family: 'Playfair Display', serif;">Manicuristas especializadas</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="profesionalesGrid"></div>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const cats = ['todas', 'manos', 'esculpidas', 'arte', 'pies', 'mantencion'];
      const labels = { todas: 'Todas', manos: 'Manos', esculpidas: 'Esculpidas', arte: 'Arte', pies: 'Pies', mantencion: 'Mantención' };
      const filter = document.getElementById('filterCategoria');
      filter.innerHTML = cats.map((c, i) => `
        <button data-cat="${c}" class="cat-tab px-5 py-2 rounded-full text-sm font-semibold transition-all ${i === 0 ? 'bg-primary text-black' : 'bg-background-card text-gray-300 border border-gray-800 hover:border-primary'}">${labels[c]}</button>
      `).join('');

      const grid = document.getElementById('serviciosGrid');
      function render(cat) {
        const list = cat === 'todas' ? SERVICIOS : SERVICIOS.filter(s => s.categoria === cat);
        grid.innerHTML = list.map(s => `
          <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden card-hover">
            <div class="aspect-[4/3] overflow-hidden">
              <img src="${s.imagen}" alt="${s.nombre}" class="w-full h-full object-cover"/>
            </div>
            <div class="p-5">
              <span class="text-[10px] uppercase tracking-widest text-primary font-semibold">${UI.categoriaLabel(s.categoria)}</span>
              <h3 class="text-xl font-bold text-white mt-1 mb-2" style="font-family: 'Playfair Display', serif;">${s.nombre}</h3>
              <p class="text-sm text-gray-400 mb-4">${s.descripcion}</p>
              <div class="flex items-center justify-between pt-4 border-t border-gray-800">
                <div>
                  <p class="text-xs text-gray-500">${s.duracion} min</p>
                  <p class="text-primary text-xl font-bold" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(s.precio)}</p>
                </div>
                <a href="reserva.html?servicio=${s.id}" class="btn-primary text-sm">Reservar</a>
              </div>
            </div>
          </div>
        `).join('');
      }
      render('todas');

      filter.querySelectorAll('.cat-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          filter.querySelectorAll('.cat-tab').forEach(t => { t.classList.remove('bg-primary', 'text-black'); t.classList.add('bg-background-card', 'text-gray-300', 'border', 'border-gray-800'); });
          tab.classList.add('bg-primary', 'text-black');
          tab.classList.remove('bg-background-card', 'text-gray-300', 'border', 'border-gray-800');
          render(tab.dataset.cat);
        });
      });

      const profs = document.getElementById('profesionalesGrid');
      profs.innerHTML = PROFESIONALES.map(p => `
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 card-hover">
          <div class="flex items-center gap-4 mb-4">
            <img src="${p.foto}" alt="${p.nombre}" class="h-16 w-16 rounded-full object-cover border-2 border-primary/30"/>
            <div>
              <h3 class="text-white font-bold" style="font-family: 'Playfair Display', serif;">${p.nombre}</h3>
              <p class="text-xs text-primary uppercase tracking-wider">${p.rol}</p>
            </div>
          </div>
          <p class="text-sm text-gray-400 mb-3">${p.experiencia} años de experiencia · ★ ${p.rating}</p>
          <div class="flex flex-wrap gap-2">
            ${p.especialidades.slice(0, 3).map(eid => {
              const s = SERVICIOS.find(x => x.id === eid);
              return s ? `<span class="text-xs bg-primary/10 text-primary border border-primary/20 px-3 py-1 rounded-full">${s.nombre}</span>` : '';
            }).join('')}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
