<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión · Nails Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#e8a4b8', 'primary-light': '#f4c2c2', accent: '#d4a574', 'background-dark': '#0f0a0c', 'background-card': '#1a1418' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-block h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 flex items-center justify-center text-primary mb-4">
          <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Bienvenida de vuelta</h1>
        <p class="text-gray-400 text-sm">Ingresa a tu cuenta para gestionar tus reservas</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-7">
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="label-base">Email</label>
            <input type="email" name="email" required class="input-base" placeholder="tu@email.com" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="label-base mb-0">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-primary hover:text-primary-light">¿Olvidaste?</a>
            </div>
            <div class="relative">
              <input type="password" name="password" id="passwordInput" required class="input-base pr-10" placeholder="••••••••" />
              <button type="button" id="togglePwd" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary p-1">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              </button>
            </div>
          </div>
          <div class="flex items-center">
            <input type="checkbox" id="remember" class="h-4 w-4 rounded border-gray-700 bg-background-dark text-primary focus:ring-primary"/>
            <label for="remember" class="ml-2 text-sm text-gray-400">Recordarme</label>
          </div>
          <div id="errorMsg" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-3"></div>
          <button type="submit" class="btn-primary w-full">Ingresar</button>
        </form>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
          <div class="relative flex justify-center text-xs"><span class="bg-background-card px-3 text-gray-500">o continúa con</span></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg border border-gray-700 hover:border-primary hover:bg-primary/5 transition-colors text-sm">
            <svg class="h-5 w-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg border border-gray-700 hover:border-primary hover:bg-primary/5 transition-colors text-sm">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .56.04.81.11V9.02a6.27 6.27 0 00-.81-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.75a8.18 8.18 0 004.77 1.52V6.84a4.84 4.84 0 01-1-.15z"/></svg>
            Facebook
          </button>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">
          ¿No tienes cuenta? <a href="registro.html" class="text-primary hover:text-primary-light font-semibold">Regístrate</a>
        </p>
      </div>

      <div class="mt-6 p-4 rounded-xl bg-primary/5 border border-primary/20 text-xs text-gray-400">
        <p class="font-semibold text-primary mb-1">Cuenta demo:</p>
        <p>Email: claudia@test.com / Contraseña: 123456</p>
        <p>Email: martina@test.com / Contraseña: 123456</p>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const toggle = document.getElementById('togglePwd');
      const input = document.getElementById('passwordInput');
      toggle.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
      });

      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMsg');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const result = Auth.login(data.email, data.password);
        if (!result.ok) {
          errorMsg.textContent = result.error;
          errorMsg.classList.remove('hidden');
          return;
        }
        errorMsg.classList.add('hidden');
        UI.toast('Bienvenida ' + result.user.nombre.split(' ')[0]);
        const redirect = Storage.get('bps_redirect');
        if (redirect) {
          Storage.remove('bps_redirect');
          setTimeout(() => window.location.href = redirect, 600);
        } else {
          setTimeout(() => window.location.href = 'perfil.html', 600);
        }
      });
    }
  </script>
</body>
</html>
