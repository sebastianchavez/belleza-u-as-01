<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña · Nails Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#e8a4b8', 'primary-light': '#f4c2c2', accent: '#d4a574', 'background-dark': '#0f0a0c', 'background-card': '#1a1418' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-block h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 flex items-center justify-center text-primary mb-4">
          <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Recuperar contraseña</h1>
        <p class="text-gray-400 text-sm" id="subtitle">Te ayudaremos a recuperar el acceso a tu cuenta</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-7">
        <div class="flex items-center justify-center mb-6 gap-2">
          <div id="step1Dot" class="h-8 w-8 rounded-full bg-primary text-black text-xs font-bold flex items-center justify-center">1</div>
          <div id="line1" class="h-0.5 w-12 bg-gray-200"></div>
          <div id="step2Dot" class="h-8 w-8 rounded-full bg-gray-700 text-gray-400 text-xs font-bold flex items-center justify-center">2</div>
        </div>

        <div id="step1" class="mb-4">
          <h3 class="text-lg font-bold text-white mb-2">Ingresa tu email</h3>
          <p class="text-sm text-gray-400 mb-4">Te enviaremos un código de verificación</p>
          <div class="space-y-4">
            <div>
              <label class="label-base">Email</label>
              <input type="email" id="emailInput" class="input-base" placeholder="tu@email.com"/>
            </div>
            <div id="error1" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-3"></div>
            <button id="btnStep1" class="btn-primary w-full">Enviar código</button>
          </div>
        </div>

        <div id="step2" class="hidden">
          <h3 class="text-lg font-bold text-white mb-2">Código de verificación</h3>
          <p class="text-sm text-gray-400 mb-4">Ingresa el código de 6 dígitos enviado a tu email</p>
          <div class="space-y-4">
            <div>
              <label class="label-base">Código de verificación</label>
              <div class="flex gap-2">
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
                <input type="text" maxlength="1" class="code-input input-base text-center text-xl font-bold"/>
              </div>
              <p class="text-xs text-gray-500 mt-2 text-center">Demo: cualquier código de 6 dígitos funciona</p>
            </div>
            <div>
              <label class="label-base">Nueva contraseña</label>
              <input type="password" id="newPass" class="input-base" placeholder="Mínimo 6 caracteres"/>
            </div>
            <div>
              <label class="label-base">Confirmar contraseña</label>
              <input type="password" id="confirmPass" class="input-base" placeholder="Repite tu contraseña"/>
            </div>
            <div id="error2" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-3"></div>
            <button id="btnStep2" class="btn-primary w-full">Cambiar contraseña</button>
            <button id="btnBack" class="text-sm text-gray-400 hover:text-primary w-full text-center">← Volver</button>
          </div>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">
          ¿Recordaste tu contraseña? <a href="inicio-sesion.html" class="text-primary hover:text-primary-light font-semibold">Ingresa</a>
        </p>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const dot1 = document.getElementById('step1Dot');
      const dot2 = document.getElementById('step2Dot');
      const line1 = document.getElementById('line1');
      let recoveryEmail = '';

      const codeInputs = document.querySelectorAll('.code-input');
      codeInputs.forEach((input, idx) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && idx < codeInputs.length - 1) codeInputs[idx + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) codeInputs[idx - 1].focus();
        });
      });

      document.getElementById('btnStep1').addEventListener('click', () => {
        const email = document.getElementById('emailInput').value.trim();
        const err = document.getElementById('error1');
        if (!email) {
          err.textContent = 'Ingresa tu email.';
          err.classList.remove('hidden');
          return;
        }
        const users = Storage.get(STORAGE_KEYS.USERS, []);
        if (!users.find(u => u.email === email)) {
          err.textContent = 'No existe una cuenta con ese email.';
          err.classList.remove('hidden');
          return;
        }
        err.classList.add('hidden');
        recoveryEmail = email;
        step1.classList.add('hidden');
        step2.classList.remove('hidden');
        dot2.classList.remove('bg-gray-700', 'text-gray-400');
        dot2.classList.add('bg-primary', 'text-black');
        line1.classList.remove('bg-gray-200');
        line1.classList.add('bg-primary');
        document.getElementById('subtitle').textContent = 'Revisa tu bandeja de entrada';
        UI.toast('Código enviado a ' + email);
      });

      document.getElementById('btnStep2').addEventListener('click', () => {
        const code = Array.from(codeInputs).map(i => i.value).join('');
        const newP = document.getElementById('newPass').value;
        const confirmP = document.getElementById('confirmPass').value;
        const err = document.getElementById('error2');
        if (code.length !== 6) {
          err.textContent = 'Ingresa el código de 6 dígitos completo.';
          err.classList.remove('hidden');
          return;
        }
        if (!newP || newP.length < 6) {
          err.textContent = 'La contraseña debe tener al menos 6 caracteres.';
          err.classList.remove('hidden');
          return;
        }
        if (newP !== confirmP) {
          err.textContent = 'Las contraseñas no coinciden.';
          err.classList.remove('hidden');
          return;
        }
        const result = Auth.resetPasswordByEmail(recoveryEmail, newP);
        if (!result.ok) {
          err.textContent = result.error;
          err.classList.remove('hidden');
          return;
        }
        err.classList.add('hidden');
        UI.toast('Contraseña actualizada. Inicia sesión.');
        setTimeout(() => window.location.href = 'inicio-sesion.html', 1000);
      });

      document.getElementById('btnBack').addEventListener('click', () => {
        step2.classList.add('hidden');
        step1.classList.remove('hidden');
        dot2.classList.add('bg-gray-700', 'text-gray-400');
        dot2.classList.remove('bg-primary', 'text-black');
        line1.classList.add('bg-gray-200');
        line1.classList.remove('bg-primary');
        document.getElementById('subtitle').textContent = 'Te ayudaremos a recuperar el acceso a tu cuenta';
      });
    }
  </script>
</body>
</html>
